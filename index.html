<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount 20%</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <main class="container">

        <section class="form-panel">

            <div class="brand">
                <div class="brand-logo"></div>
                <div class="brand-name">Mockup</div>
            </div>

            <h1>Get a special 20% discount</h1>
            <p class="subtitle">Please enter your mail</p>

            <form id="subscribeForm" novalidate>

                <div class="field">
                    <label for="emailInput">Email</label>

                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 20 20" 
                        fill="none"><path d="M2 5.5L10 11L18 5.5" 
                        stroke="currentColor" stroke-width="1.3"/>
                        <rect x="2" y="4" width="16" height="12" rx="2" 
                        stroke="currentColor" stroke-width="1.3"/></svg>
                        <input type="email" id="emailInput" name="email" 
                        placeholder="Email" required>
                    </div>
                </div>

                <div class="row-between">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agreeCheckbox">
                        I agree to receive the newsletter.
                    </label>
                </div>
 
                <button type="submit" class="btn-primary">Get a discount</button>
 
                <div class="divider"><span>OR</span></div>
 
                <button type="button" class="btn-secondary">
                    <svg viewBox="0 0 20 20" fill="none">
                    <path d="M3 10L17 10M17 10L11 4M17 10L11 16" 
                    stroke="currentColor" stroke-width="1.4"/></svg>
                    Share with a friend
                </button>
            </form>

            <p class="terms">By sending your email, you agree to our
                <a href="#">Terms of Use</a>
            </p>
        </section>

        <section class="hero-image" aria-hidden="true">
            <img src="./tablet-screen.webp">
        </section>

    </main>

     <!-- Modal window -->
    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <button class="modal-close" id="modalClose" 
            aria-label="Close">×</button>

            <p class="modal-top">Great!</p>

            <h2>A 20% discount has been applied to your account.</h2>

            <div class="discount">
                <p id="promoCode">MOCKUP20</p>
                <button class="copy-btn" id="copyBtn">Copy</button>
            </div>

            <p class="modal-text">Check your inbox! Your promo is 
                already waiting for you. And make sure to use it by 
                the end of the week.</p>

            <button class="modal-ok" id="modalOk">Understand</button>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
